<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page not found</title>
<style>
  :root { color-scheme: light dark; --ink: #1c1c1a; --soft: #5f5e5a; --ground: #faf9f5; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --soft: #a3a198; --ground: #1a1a18; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--ground); color: var(--ink);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p { margin: 0; color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>There is no page at this address</h1>
  <p>It may have been removed, or the link may be incomplete. Ask whoever sent it for the current link.</p>
</main>
</body>
</html>
