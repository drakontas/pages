name: check pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      # What is being judged: the branch itself, with its history, so its commits can be read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: branch
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # What judges it: the check as it stands on main. A branch cannot loosen the check
      # it is judged by.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: main
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The check's own tests
        working-directory: branch
        run: python -m unittest discover -s tests
      - name: Every file in the repo
        run: |
          tool=main/tools/check_pages.py
          if [ ! -f "$tool" ]; then
            # Only the branch that brings the check in may be judged by its own copy,
            # and that branch holds no page.
            if ls -d branch/[0-9][0-9][0-9][0-9]-[0-9][0-9]-* >/dev/null 2>&1; then
              echo "main holds no check, and this branch holds a page."
              echo "A page is judged by the check on main, and by no other."
              exit 1
            fi
            echo "main holds no check yet, so the branch's own copy is used."
            tool=branch/tools/check_pages.py
          fi
          if [ -n "$BASE_REF" ]; then
            git -C branch fetch --quiet origin "$BASE_REF"
            python "$tool" --root branch --changed-against "origin/$BASE_REF"
          else
            python "$tool" --root branch
          fi
